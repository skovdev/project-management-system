# Project Management System: Kafka Configuration
project-management-system.kafka.server=localhost:9092
project-management-system.kafka.topic.partitions=3
project-management-system.kafka.topic.replication-factor=1

# Distributed Tracing: Micrometer + Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# Metrics: Prometheus
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=task-service
