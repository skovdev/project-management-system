# Project Management System: AI Service Configuration
project-management-system.client.ai-service.url=http://localhost:8085/api/v1/ai/task

# Project Management System: Organization Service Configuration
project-management-system.client.organization-service.url=http://localhost:8086/api/v1/organizations

# Project Management System: Project Service Configuration
project-management-system.client.project-service.url=http://localhost:8081/api/v1/projects

# Spring Cloud: Feign Client Timeouts
spring.cloud.openfeign.client.config.aiServiceClient.connect-timeout=5000
spring.cloud.openfeign.client.config.aiServiceClient.read-timeout=15000

# Resilience4j CircuitBreaker
resilience4j.circuitbreaker.instances.taskAcceptanceCriteriaAiGeneration.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.taskAcceptanceCriteriaAiGeneration.slidingWindowSize=20
resilience4j.circuitbreaker.instances.taskAcceptanceCriteriaAiGeneration.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.taskAcceptanceCriteriaAiGeneration.failureRateThreshold=50
resilience4j.circuitbreaker.instances.taskAcceptanceCriteriaAiGeneration.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.taskAcceptanceCriteriaAiGeneration.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.instances.taskAcceptanceCriteriaAiGeneration.automaticTransitionFromOpenToHalfOpenEnabled=true

# Resilience4j Retry
resilience4j.retry.instances.taskAcceptanceCriteriaAiGeneration.maxAttempts=2
resilience4j.retry.instances.taskAcceptanceCriteriaAiGeneration.waitDuration=200ms
resilience4j.retry.instances.taskAcceptanceCriteriaAiGeneration.enableExponentialBackoff=true
resilience4j.retry.instances.taskAcceptanceCriteriaAiGeneration.exponentialBackoffMultiplier=2
resilience4j.retry.instances.taskAcceptanceCriteriaAiGeneration.retryExceptions=feign.RetryableException,java.net.SocketTimeoutException
resilience4j.retry.instances.taskAcceptanceCriteriaAiGeneration.ignoreExceptions=feign.FeignException$BadRequest,feign.FeignException$Unauthorized,feign.FeignException$Forbidden,feign.FeignException$NotFound,feign.FeignException$UnprocessableEntity

